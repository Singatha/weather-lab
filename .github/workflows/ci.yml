name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run typecheck:web
      - run: npm run test:coverage:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  api:
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests performance
      - run: ruff format --check app tests performance
      - run: mypy app tests performance
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml

  containers:
    name: Container configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose --env-file .env.production.example -f compose.production.yml config --quiet
      - run: docker compose up --build --detach --wait api
      - name: Performance smoke check
        run: >-
          docker compose exec -T api python -m performance.smoke
          --base-url http://127.0.0.1:8000
          --requests 100
          --concurrency 20
          --max-p95-ms 250
      - if: always()
        run: docker compose down

  production-smoke:
    name: Production stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral Redis secret
        run: |
          mkdir -p secrets
          openssl rand -hex 32 > secrets/redis_password.txt
          chmod 600 secrets/redis_password.txt
      - name: Start production stack
        run: >-
          docker compose --env-file .env.production.example
          -f compose.production.yml up --build --detach --wait
      - name: Verify HTTPS frontend and API routing
        run: |
          curl --fail --insecure --silent --show-error https://localhost/ > /dev/null
          curl --fail --insecure --silent --show-error https://localhost/health/live | grep -q '"status":"ok"'
          test "$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' https://localhost/api/v1/weather)" = "422"
          test "$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' https://localhost/metrics)" = "404"
          test "$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' https://localhost/openapi.json)" = "404"
      - if: always()
        run: >-
          docker compose --env-file .env.production.example
          -f compose.production.yml down --volumes

