name: weather-lab

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: development
    command: npm run dev --workspace @weather/web -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/workspace/apps/web
      - web_node_modules:/workspace/node_modules
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
      target: development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Weather API}
      API_CORS_ORIGINS: '${API_CORS_ORIGINS:-["http://localhost:5173"]}'
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-1}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-20}
      LOCATION_CACHE_TTL_SECONDS: ${LOCATION_CACHE_TTL_SECONDS:-86400}
      WEATHER_CACHE_TTL_SECONDS: ${WEATHER_CACHE_TTL_SECONDS:-900}
      WEATHER_CACHE_STALE_TTL_SECONDS: ${WEATHER_CACHE_STALE_TTL_SECONDS:-7200}
      OPEN_METEO_FORECAST_URL: ${OPEN_METEO_FORECAST_URL:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_GEOCODING_URL: ${OPEN_METEO_GEOCODING_URL:-https://geocoding-api.open-meteo.com/v1/search}
      WEATHER_PROVIDER_TIMEOUT_SECONDS: ${WEATHER_PROVIDER_TIMEOUT_SECONDS:-10}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
  web_node_modules:

